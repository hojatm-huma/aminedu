name: Build and Push studentbe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build image
        working-directory: student-be
        run: docker build -f Dockerfile . -t ghcr.io/hojatm-huma/student-be:${GITHUB_SHA::7}

      - name: push image
        run: docker push ghcr.io/hojatm-huma/student-be:${GITHUB_SHA::7}
