name: Build, push and deploy student backend

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build image
        working-directory: student-be
        run: docker build -f Dockerfile . -t ghcr.io/hojatm-huma/student-be:${GITHUB_SHA::7}

      - name: push image
        run: docker push ghcr.io/hojatm-huma/student-be:${GITHUB_SHA::7}

      - name: setup helm
        uses: azure/setup-helm@v5

      - name: setup kubeconfig
        run: |
          mkdir -p ./kube
          echo "${{ secrets.ARVAN_CLOUD_KUBECONFIG }}" | base64 --decode > ./kube/config

      - name: deploy
        run: |
          helm upgrade --install student-be ./helmchart \
            --kubeconfig ./kube/config \
            --values student-be/deploy/values.yaml \
            --set image.tag=${GITHUB_SHA::7}
